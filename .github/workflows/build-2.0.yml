name: Build 2.0

on:
  push:
    branches: [ "2.0" ]

jobs:
  build-linux:
    name: ${{ matrix.compiler }} on ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [ g++, clang++ ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DBUILD_DOC=OFF -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} .

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-macos:
    name: clang++ on macos-latest
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DBUILD_DOC=OFF .

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-windows:
    name: MSVC on windows-latest
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Visual Studio's CMake generator is multi-config, so the repo's
      # own test_runner.py (see CLAUDE.md) is used here instead of the
      # plain cmake/ctest invocations above, since it already knows to
      # pass --config through to both the build and ctest.
      - name: Create build directory
        run: mkdir build

      - name: Configure, build, and test
        run: python test_runner.py --build --build_dir=build --config=Debug
